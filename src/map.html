    <script>
        const filteredAxisVarsPath = pathDep.filteredVarsPath;

        function normalizeFilteredAxisVarBlacklist(varList) {
            if (!Array.isArray(varList)) {
                return [];
            }

            return varList
                .map((varName) => typeof varName === 'string' ? varName.trim() : '')
                .filter((varName) => varName.length > 0);
        }

        function loadFilteredAxisVarBlacklist() {
            try {
                if (!fs.existsSync(filteredAxisVarsPath)) {
                    fs.mkdirSync(path.dirname(filteredAxisVarsPath), { recursive: true });
                    fs.writeFileSync(filteredAxisVarsPath, JSON.stringify({ vars: [] }, null, 2), 'utf-8');
                    return [];
                }

                const rawContent = fs.readFileSync(filteredAxisVarsPath, 'utf-8');
                if (!rawContent.trim()) {
                    return [];
                }

                const parsedContent = JSON.parse(rawContent);
                const storedVars = Array.isArray(parsedContent)
                    ? parsedContent
                    : parsedContent?.vars;

                return normalizeFilteredAxisVarBlacklist(storedVars);
            } catch (error) {
                console.error('Failed to load filtered axis vars:', error);
                return [];
            }
        }

        function persistFilteredAxisVarBlacklist() {
            try {
                const normalizedVars = normalizeFilteredAxisVarBlacklist(appState.filteredAxisVarBlacklist);
                appState.filteredAxisVarBlacklist = normalizedVars;

                fs.mkdirSync(path.dirname(filteredAxisVarsPath), { recursive: true });
                fs.writeFileSync(filteredAxisVarsPath, JSON.stringify({ vars: normalizedVars }, null, 2), 'utf-8');
            } catch (error) {
                console.error('Failed to save filtered axis vars:', error);
            }
        }

        // State object for DOM functions
        const appState = {
            allFiles: fileHandle.listSavedDataFiles(pathDep.resolveToProperDataPath(__dirname, 'savedData'), '.nc'),
            isMultiSelect: false,
            selectedFiles: new Set(),

            mapTimelineMode: "slider", // or "input"

    async function importTransferredPackage(filePath) {
        let extractionResult = null;
        const importSummary = {
            platformsImported: 0,
            platformsSkipped: 0,
            viewsImported: 0,
            viewsSkipped: 0,
            settingsImported: 0,
            settingsSkipped: 0,
            filteredVarsImported: 0,
            filteredVarsSkipped: 0
        };

        try {
            DOM.showLoadingScreen();
            DOM.setLoadingText('Preparing transfer package import...');

            if (!filePath) {
                const selectionResult = await ipcRenderer.invoke('transfer-select-import-package');
                if (selectionResult?.canceled) {
                    return;
                }

                if (!selectionResult?.success) {
                    throw new Error(selectionResult?.error || 'Failed to select a transfer package.');
                }

                filePath = selectionResult.filePath;
            }

            DOM.setLoadingText('Extracting transfer package...');
            extractionResult = await transfer.extractTransferArchive(filePath);
            if (!extractionResult?.success) {
                throw new Error(extractionResult?.error || 'Failed to extract the selected transfer package.');
            }

            DOM.setLoadingText('Importing transfer package...');

            const queueEntries = [];

            extractionResult.fileManifest.settings.forEach((entry) => {
                const result = config.importConfigFile(entry.sourcePath);
                if (!result.success) {
                    throw new Error(result.error || `Failed to import settings from ${entry.fileName}.`);
                }

                if (result.success && !result.skipped) {
                    importSummary.settingsImported += 1;
                } else if (result.skipped) {
                    importSummary.settingsSkipped += 1;
                }
            });

            extractionResult.fileManifest.filteredVars.forEach((entry) => {
                try {
                    fs.copyFileSync(entry.sourcePath, entry.destPath);
                    importSummary.filteredVarsImported += 1;
                    appState.filteredAxisVarBlacklist = loadFilteredAxisVarBlacklist();
                } catch (error) {
                    importSummary.filteredVarsSkipped += 1;
                }
            });

            extractionResult.fileManifest.views.forEach((entry) => {
                const result = fileHandle.copyFileToSavedData(entry.sourcePath, pathDep.savedDataPath, {
                    overwriteSettingKey: 'EnableImportOverwrittingForTransferedViews'
                });
                if (result.success && !result.skipped) {
                    importSummary.viewsImported += 1;
                } else if (result.skipped) {
                    importSummary.viewsSkipped += 1;
                }
            });

            extractionResult.fileManifest.platforms.forEach((entry) => {
                const result = fileHandle.copyFileToSavedData(entry.sourcePath, pathDep.savedDataPath, {
                    overwriteSettingKey: 'EnableImportOverwrittingForTransferedPlatforms'
                });
                if (result.success && !result.skipped) {
                    importSummary.platformsImported += 1;
                    queueEntries.push({
                        fileName: entry.fileName,
                        destPath: result.destPath,
                        allowOverwriteExistingEntry: Boolean(result.overwritten)
                    });
                } else if (result.skipped) {
                    importSummary.platformsSkipped += 1;
                }
            });

            if (queueEntries.length > 0) {
                queue.addToImportQeue(queueEntries);
                DOM.setLoadingText('Processing imported platform data...');
                await fileHandle.processImportQeue(appState, ModuleDependencies);
            }

            DOM.loadSideBar_Glider(appState, ModuleDependencies["DOM"], DOM.displayDatasetInfo);
            DOM.loadSideBar_Views(appState, ModuleDependencies["DOM"], handleSavedViewSelection);

            const settingsRestartMessage = importSummary.settingsImported > 0
                ? '<br><br>Imported settings are saved to disk. Restart the app if you want the imported settings to fully apply right away.'
                : '';

            logging.log(params={
                callerInfo: basicFunctions.getCallerInfo(),
                state: appState,
                dep: ModuleDependencies["logging"],
                msgLabel: `Transfer Import Complete`,
                msg: `Platforms imported: ${importSummary.platformsImported} (skipped: ${importSummary.platformsSkipped})<br>
                Views imported: ${importSummary.viewsImported} (skipped: ${importSummary.viewsSkipped})<br>
                Settings imported: ${importSummary.settingsImported} (skipped: ${importSummary.settingsSkipped})<br>
                Filtered vars imported: ${importSummary.filteredVarsImported} (skipped: ${importSummary.filteredVarsSkipped})${settingsRestartMessage}`,
                seriousness: 'info',
                code: '0000',
                class: 'FS',
                ignoreConsole: false,
                ignorePopup: false,
                ignoreNotification: false,
                ignoreLogging: false
            });
        } catch (error) {
            logging.log(params={
                callerInfo: basicFunctions.getCallerInfo(),
                state: appState,
                dep: ModuleDependencies["logging"],
                msgLabel: `Transfer Import Failed`,
                msg: error.message,
                seriousness: 'error',
                code: '0003',
                class: 'FS',
                ignoreConsole: false,
                ignorePopup: false,
                ignoreNotification: false,
                ignoreLogging: false
            });
        } finally {
            if (extractionResult?.tempDir) {
                transfer.cleanupTransferExtraction(extractionResult.tempDir);
            }

            DOM.hideLoadingScreen();
        }
    }

    async function runCleanUpReferences() {
        const savedDataFiles = fileHandle.listSavedDataFiles(pathDep.savedDataPath, '.nc');
        const desyncedFiles = savedDataFiles.filter((fileName) => !fileHandle.doesEntryExistInSimpleData(fileName, false));

        DOM.showLoadingScreen();
        DOM.setLoadingText('Cleaning up desynced savedData references...');

        try {
            if (desyncedFiles.length === 0) {
                logging.log(params={
                    callerInfo: basicFunctions.getCallerInfo(),
                    state: appState,
                    dep: ModuleDependencies["logging"],
                    msgLabel: 'Reference Cleanup Complete',
                    msg: 'No desynced platform files were found in savedData.',
                    seriousness: 'info',
                    code: '0000',
                    class: 'FS',
                    ignoreConsole: false,
                    ignorePopup: false,
                    ignoreNotification: false,
                    ignoreLogging: false
                });
                return;
            }

            const removedFiles = [];
            const failedFiles = [];

            desyncedFiles.forEach((fileName) => {
                const deleteResult = fileHandle.deleteDataFile(fileName);
                if (deleteResult.success) {
                    removedFiles.push(fileName);
                } else {
                    failedFiles.push(`${fileName}: ${deleteResult.error || 'Unknown error'}`);
                }
            });

            appState.selectedFiles = new Set(
                Array.from(appState.selectedFiles).filter((fileName) => !removedFiles.includes(fileName))
            );
            appState.isMultiSelect = appState.selectedFiles.size > 1;

            DOM.loadSideBar_Glider(appState, ModuleDependencies["DOM"], DOM.displayDatasetInfo);

            if (appState.selectedFiles.size === 0) {
                document.getElementById('titleTargetFile').textContent = 'Data';
                DOM.dom_clearElementInnerHTML_UsingString('datasetInfoCardWrapper');
                DOM.dom_clearElementInnerHTML_UsingString('datasetAttrCardWrapper');
                DOM.dom_clearElementInnerHTML_UsingString('datasetVarsCardWrapper');
            }

            const removedMessage = removedFiles.length > 0
                ? `Removed desynced platform files:<br>${removedFiles.join('<br>')}`
                : 'No desynced platform files were removed.';
            const failedMessage = failedFiles.length > 0
                ? `<br><br>Failed removals:<br>${failedFiles.join('<br>')}`
                : '';

            logging.log(params={
                callerInfo: basicFunctions.getCallerInfo(),
                state: appState,
                dep: ModuleDependencies["logging"],
                msgLabel: 'Reference Cleanup Complete',
                msg: `${removedMessage}${failedMessage}`,
                seriousness: failedFiles.length > 0 ? 'warning' : 'info',
                code: failedFiles.length > 0 ? '0002' : '0000',
                class: 'FS',
                ignoreConsole: false,
                ignorePopup: false,
                ignoreNotification: false,
                ignoreLogging: false
            });
        } finally {
            DOM.hideLoadingScreen();
        }
    }

    document.getElementById('mapPopupfilterTypeDropdown').addEventListener('change', function() {
        let selectedValue = this.value;
        if (selectedValue === "option1"){
            document.getElementById('LocationFilterWrapper').style.display = 'none';

    function updateLocationFilterBounds() {
        if (document.getElementById('latMin').value === "") document.getElementById('latMin').value = 0;
        if (document.getElementById('latMax').value === "") document.getElementById('latMax').value = 0;
        if (document.getElementById('lonMin').value === "") document.getElementById('lonMin').value = 0;
        if (document.getElementById('lonMax').value === "") document.getElementById('lonMax').value = 0;
        appState.mapLocationFiltering.latMin = parseFloat(document.getElementById('latMin').value);
        appState.mapLocationFiltering.latMax = parseFloat(document.getElementById('latMax').value);
        appState.mapLocationFiltering.lonMin = parseFloat(document.getElementById('lonMin').value);
        appState.mapLocationFiltering.lonMax = parseFloat(document.getElementById('lonMax').value);

        appState.mapLocationFiltering.locationFilterBounds = [[appState.mapLocationFiltering.latMin, appState.mapLocationFiltering.lonMin], [appState.mapLocationFiltering.latMax, appState.mapLocationFiltering.lonMax]];
        // Update the rectangle on the map
        if (appState.mapLocationFiltering.locationFilterRectangle) {
            appState.mapLocationFiltering.locationFilterMap.removeLayer(appState.mapLocationFiltering.locationFilterRectangle);
        }
        appState.mapLocationFiltering.locationFilterRectangle = L.rectangle(appState.mapLocationFiltering.locationFilterBounds, {color: "#ff7800", weight: 1}).addTo(appState.mapLocationFiltering.locationFilterMap);
        appState.mapLocationFiltering.locationFilterMap.fitBounds(appState.mapLocationFiltering.locationFilterBounds);
    
        DOM.leaf_filterPlatformsByLocation(appState, ModuleDependencies["DOM"]);
    }

    document.getElementById('createViewButton').addEventListener('click', function() {
        let targetViewData = DOM.constructViewDataViaPreferences(appState, ModuleDependencies["DOM"], document.getElementById('newViewGraphData').value);
        appState.currentView = {
                    name: null,
                    type: null,
                    dataSelection: null,
                    chartInstances: [],
                    vars: null,
                    viewVars: new Set(),
                    isViewGenerated: false,
                    includePlotData: false
        };

        if (targetViewData.length === 0) {
            console.log("No data selected for new view");
            //popup.popupTemplates.Spawn_noFilesToPlot().open();
            logging.log(params={
                callerInfo:basicFunctions.getCallerInfo(),
                state:appState,
                dep:ModuleDependencies["logging"],
                msgLabel: `No Files To Plot`,
                msg: `You attempted to create a new view of your files but no files were included based on your preference, 
                This most likely means that you forgot to select your files or forget to filter them (depending on your data preference). 
                Please try handling your files again before creating a new view with them.`,
                seriousness: 'warning',
                code: '0001',
                class:'INPUT',
                ignoreConsole: false,
                ignorePopup: false,
                ignoreNotification: false,
                ignoreLogging: false
            });
            return;
        }
        console.log("before", targetViewData);
        if (document.getElementById('useOnlyFilesWithPPTInput').checked) {
            targetViewData = targetViewData.filter(fileName => {
                let fileVars = fileHandle.getEntryKeyInSimpleData(fileName, 'vars');
                const hasPres = basicFunctions.hasMatchingVariable(fileVars, 'pressure', ['PRES', 'PRES_ADJUSTED']);
                const hasTemp = basicFunctions.hasMatchingVariable(fileVars, 'temperature', ['TEMP', 'TEMP_ADJUSTED']);
                const hasPsal = basicFunctions.hasMatchingVariable(fileVars, 'salinity', ['PSAL', 'PSAL_ADJUSTED']);
                return hasPres && hasTemp && hasPsal;
            });
            if (targetViewData.length === 0) {
                logging.log(params={
                    callerInfo: basicFunctions.getCallerInfo(),
                    state: appState,
                    dep: ModuleDependencies["logging"],
                    msgLabel: `No Files With PRES/PSAL/TEMP`,
                    msg: `All selected files were excluded because none of them contain PRES, PSAL, and TEMP variables.`,
                    seriousness: 'warning',
                    code: '0001',
                    class: 'INPUT',
                    ignoreConsole: false,
                    ignorePopup: false,
                    ignoreNotification: false,
                    ignoreLogging: false
                });
                return;
            }
        }
        console.log("after", targetViewData);

        let varsPerFile = [];
        let areFileVarsUnbalanced = false;
        targetViewData.forEach((fileName) => {
            console.log("including File in new view:", fileName);
            let viewFilePath = path.join(pathDep.savedDataPath, fileName);
            let doesFileExist = fileHandle.doesFileAlreadyExist(viewFilePath);

            if (!doesFileExist) {
                console.error("File not found:", fileName);
                return;
            } else {
                let allfoundVars = fileHandle.getEntryKeyInSimpleData(fileName, 'vars');
                
                varsPerFile.push(new Set(allfoundVars));
            }
        });

        
        // Intersection: collect all sets first, THEN filter
        appState.currentView.viewVars = new Set();
        if (varsPerFile.length > 0) {
            varsPerFile[0].forEach(v => {
                if (varsPerFile.every(s => s.has(v))) {
                    appState.currentView.viewVars.add(v);
                } else {
                    areFileVarsUnbalanced = true;
                }
            });
            // Also check for vars in other files not present in file[0]
            if (!areFileVarsUnbalanced) {
                for (let i = 1; i < varsPerFile.length; i++) {
                    varsPerFile[i].forEach(v => {
                        if (!varsPerFile[0].has(v)) areFileVarsUnbalanced = true;
                    });
                }
            }
        }

        if (areFileVarsUnbalanced) {
            logging.log(params={
                callerInfo:basicFunctions.getCallerInfo(),
                state:appState,
                dep:ModuleDependencies["logging"],
                msgLabel: `Vars Unbalanced`,
                msg: `An attempt was made to create a view with files that do not share the same amount of variables (some have more vars than others).<br><br>
                To prevent errors, The view has defaulted to only including the variables that are found in all the files.<br><br>
                
                The only variables included in the new view are: ${Array.from(appState.currentView.viewVars).join("<br> ")}<br><br>`,
                seriousness: 'info',
                code: '0001',
                class:'INPUT',
                ignoreConsole: false,
                ignorePopup: false,
                ignoreNotification: false,
                ignoreLogging: false
            });
        }

        

            console.log("View vars (intersection):", appState.currentView.viewVars);

        
        

        applyViewToAppState({
            name: document.getElementById('newViewName').value,
            type: document.getElementById('newViewGraphType').value,
            dataSelection: document.getElementById('newViewGraphData').value,
            vars: Array.from(appState.currentView.viewVars),
            viewVars: new Set(appState.currentView.viewVars),
            isViewGenerated: appState.currentView.isViewGenerated,
            includePlotData: appState.currentView.includePlotData,
            data: targetViewData,
            OnlyUseFirstTimestamps: document.getElementById('useOnlyFirstTimestampInput').checked,
            useOnlyFilesWithPPTInput: document.getElementById('useOnlyFilesWithPPTInput').checked
        });

        console.log("New View Created:", appState.currentView);
        console.log(appState);
        
    });

        console.log("Add suboption clicked");
        
        appState.currentView.chartInstances.push(DOM.dom_createChartInstance());
        DOM.renderCharts(appState, ModuleDependencies["DOM"]);

    // document.getElementById('bannerButton3').addEventListener('click', function() {
    //     alert("Test 1");
    //     alert("→ Test 2 ←");
    //     alert("<h2>Test 3</h2>");
    // });

    document.getElementById('SaveViewButton').addEventListener('click', function() {
        document.getElementById('saveViewNameInput').value = appState.currentView.name || 'choose a name...';
        appState.popups.saveViewMessagePopup.open();
    });

    document.getElementById('confirmSaveViewButton').addEventListener('click', async function() {
        DOM.showLoadingScreen();
        DOM.setLoadingText('Saving view...');

        try {
        await new Promise(resolve => requestAnimationFrame(resolve));

        const includePlotData = document.getElementById('cacheDataInput').checked;
        appState.currentView.includePlotData = includePlotData;

        const copyOfCurrentView = {
            ...appState.currentView,
            includePlotData,
            dataMap: includePlotData ? (appState.currentView.dataMap || {}) : {}
        };

        const requestedViewName = document.getElementById('saveViewNameInput').value.trim() || copyOfCurrentView.name || 'Untitled View';
        const sanitizedViewName = fileHandle.sanitizeViewFileName(requestedViewName);
        const targetFileName = `${sanitizedViewName}${fileHandle.VIEW_FILE_EXTENSION}`;
        const existingViews = fileHandle.listSavedViewFiles();
        const doesViewAlreadyExist = existingViews.includes(targetFileName);

        const saveResult = await fileHandle.saveViewToFile(copyOfCurrentView, {
            name: requestedViewName,
            fileName: sanitizedViewName,
            includePlotData
        });

        if (!saveResult.success) {
            console.error('Failed to save view:', saveResult.error);
            return;
        }

        if (saveResult.skipped) {
            console.log(`Skipped saving view because overwrite is disabled: ${targetFileName}`);
            return;
        }

        console.log(doesViewAlreadyExist
            ? `Overwrote saved view: ${targetFileName}`
            : `Saved new view: ${targetFileName}`);

        DOM.loadSideBar_Views(appState, ModuleDependencies["DOM"], handleSavedViewSelection);
        } finally {
            DOM.hideLoadingScreen();
        }

    });

</script>

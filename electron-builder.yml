mac:
  target:
    - target: "dmg"
      arch: "universal"
    - target: "zip"
      arch: "universal"
  category: public.app-category.utilities
  icon: build/icon.icns
  extraResources:
    - from: PythonPortableMac_arm64/
      to: PythonPortableMac_arm64/
    - from: PythonPortableMac_x64/
      to: PythonPortableMac_x64/
    - from: config/
      to: dist/config/
    - from: savedData/
      to: dist/savedData/
    - from: logs/
      to: dist/logs/
    - from: qeues/
      to: dist/qeues/
  x64ArchFiles: "Contents/Resources/PythonPortableMac_*/**"

asarUnpack:
  - src/common/pythonProcess.py

files:
  - src/**/*
  - package.json
  - LICENSE
  - README.md

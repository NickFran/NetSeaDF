appId: com.nick.myapp
productName: NetSeaDF
directories:
  output: output
afterPack: build/afterPack.js

win:
  target: nsis
  signAndEditExecutable: false
  icon: build/icon.ico
  extraResources:
    - from: PythonPortable/
      to: PythonPortable/
    - from: config/
      to: dist/config/
    - from: savedData/
      to: dist/savedData/
    - from: logs/
      to: dist/logs/
    - from: qeues/
      to: dist/qeues/

mac:
  target:
    - target: "dmg"
      arch: "universal"
    - target: "zip"
      arch: "universal"
  category: public.app-category.utilities
  icon: build/icon.icns
  extraResources:
    - from: PythonPortableMac_arm64/
      to: PythonPortableMac_arm64/
    - from: PythonPortableMac_x64/
      to: PythonPortableMac_x64/
    - from: config/
      to: dist/config/
    - from: savedData/
      to: dist/savedData/
    - from: logs/
      to: dist/logs/
    - from: qeues/
      to: dist/qeues/
  x64ArchFiles:
    - "Contents/Resources/PythonPortableMac_arm64/python/bin/python3.10"
    - "Contents/Resources/PythonPortableMac_x64/python/bin/python3.10"

asarUnpack:
  - src/common/pythonProcess.py

files:
  - src/**/*
  - package.json
  - LICENSE
  - README.md
